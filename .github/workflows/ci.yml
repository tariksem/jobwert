name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Notify IndexNow
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Cloudflare Pages deploys the same commit asynchronously. Give the
          # public key file a short window to become available before pinging.
          sleep 75
          payload='{"host":"jobwert.de","key":"4dc9f87f6cb72de4032664fbb1f85978","keyLocation":"https://jobwert.de/4dc9f87f6cb72de4032664fbb1f85978.txt","urlList":["https://jobwert.de/","https://jobwert.de/jobangebote-vergleichen/","https://jobwert.de/gehaltserhoehung-rechner/","https://jobwert.de/umzug-fuer-job-rechner/","https://jobwert.de/homeoffice-vs-buero-rechner/","https://jobwert.de/gehaltsverhandlung/","https://jobwert.de/jobwechsel-rechner/","https://jobwert.de/pendelkosten-jobwechsel/","https://jobwert.de/lohnt-sich-mehr-gehalt/","https://jobwert.de/weniger-gehalt-mehr-homeoffice/"]}'
          http_code=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload" https://api.indexnow.org/indexnow || true)
          echo "IndexNow HTTP status: $http_code"
          cat /tmp/indexnow-response.txt || true
          # IndexNow is an SEO notification, not a build gate. A temporary
          # endpoint failure must not block production deployment.
